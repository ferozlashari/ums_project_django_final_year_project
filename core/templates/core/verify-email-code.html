{% extends "core/base.html" %}
{% block title %}Enter verification code{% endblock %}
{% block content %}
<div class="auth-card" style="text-align:center">
  <h2>Enter your 6-digit code</h2>
  <p class="muted">Sent to <strong>{{ email }}</strong>. It is valid for 10 minutes.</p>
  <form method="post">{% csrf_token %}
    <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required autofocus
           style="font-size:1.6rem;letter-spacing:8px;text-align:center;width:11em">
    <div class="form-actions" style="margin-top:14px"><button class="btn" type="submit">Verify &amp; sign in</button></div>
  </form>
  <form method="post" action="{% url 'verify-email-resend' %}" style="margin-top:10px">{% csrf_token %}<button class="btn ghost" type="submit">Send a new code</button></form>
</div>
{% endblock %}
