<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bad Request - UMS</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { text-align:center; max-width:480px; padding:40px 30px; background:#1e293b; border-radius:14px; box-shadow:0 12px 28px rgba(0,0,0,.3); }
    .icon { font-size:3rem; }
    h1 { margin:10px 0; font-size:1.4rem; }
    p { color:#94a3b8; line-height:1.5; }
    a { display:inline-block; margin-top:16px; padding:10px 22px; background:#2563eb; color:#fff; text-decoration:none; border-radius:8px; font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚫</div>
    <h1>Bad request</h1>
    <p>The request couldn't be understood or was missing required information. Please go back and try again.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
