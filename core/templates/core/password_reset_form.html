{% extends "core/base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Forgot your password?</h2>
  <p class="muted">Enter your account email and we will send you a 6-digit code and a reset link - use whichever is easier.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button class="btn" type="submit">Send Code &amp; Link</button>
      <a class="btn ghost" href="{% url 'login' %}">Back to Login</a>
    </div>
  </form>
</div>
{% endblock %}
