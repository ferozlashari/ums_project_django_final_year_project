# Nginx reverse proxy for the Docker stack (Internet -> Nginx -> Gunicorn -> Django).
# HTTP works out of the box. For a real domain put TLS in front (see nginx-vps.conf
# or your platform's load balancer) and set SECURE_SSL_REDIRECT=1 + SECURE_PROXY_SSL_HEADER=1.
#
# PRIVATE MEDIA: uploads (CNIC scans, certificates, submissions) are NOT served from
# a public /media/ path. Django authorises each request at /media/<path>, then replies
# with X-Accel-Redirect and nginx streams the file from the *internal-only* location.

upstream ums_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Reachable only through X-Accel-Redirect from Django - a direct request gets 404.
    location /_protected_media/ {
        internal;
        alias /app/media/;
    }

    location / {
        proxy_pass http://ums_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
