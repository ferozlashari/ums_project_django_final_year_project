# Bare-metal VPS (Ubuntu): Nginx -> Gunicorn on a unix/TCP socket, HTTPS via certbot.
#   sudo cp deployment/nginx-vps.conf /etc/nginx/sites-available/ums
#   sudo ln -s /etc/nginx/sites-available/ums /etc/nginx/sites-enabled/ums
#   sudo certbot --nginx -d ums.example.edu      # adds the 443 block + renewal
# Replace ums.example.edu and /srv/ums with your domain and project path.
# In .env: SECURE_SSL_REDIRECT=1 SECURE_PROXY_SSL_HEADER=1 SECURE_COOKIES=1
#          MEDIA_ACCEL_PREFIX=/_protected_media/ ALLOWED_HOSTS=ums.example.edu
#          CSRF_TRUSTED_ORIGINS=https://ums.example.edu

upstream ums_web { server 127.0.0.1:8000; }

server {
    listen 80;
    server_name ums.example.edu;
    client_max_body_size 10M;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location /static/ { alias /srv/ums/staticfiles/; expires 7d; access_log off; }
    location /_protected_media/ { internal; alias /srv/ums/media/; }

    location / {
        proxy_pass http://ums_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
