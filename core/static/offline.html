<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>You're offline - UMS</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f6f8fc; color: #1e293b; text-align: center; padding: 24px;
    }
    @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #e2e8f0; } }
    .card { max-width: 380px; }
    .icon { font-size: 3rem; margin-bottom: 8px; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { color: #64748b; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: #2563eb; color: #fff; border: none; border-radius: 8px;
      padding: 10px 20px; font-size: 0.95rem; cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>UMS needs an internet connection to load this page. Your data is never cached for offline
       viewing, so nothing shown here would be out of date - once you're back online, just retry.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
