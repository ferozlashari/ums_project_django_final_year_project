# Render free tier: ONE web service + free PostgreSQL. No Redis, no worker, no beat.
# The app runs its built-in scheduler (deployment/start-single.sh).
# Use:  Render -> New -> Blueprint -> pick this file (Blueprint path: render-free.yaml)
#
# Free-tier reality (not suitable for production):
#  * the web service sleeps when idle, and a sleeping service runs no scheduled jobs.
#    Wake it + run due jobs with a free pinger (cron-job.org / UptimeRobot) calling
#      POST https://<your-app>.onrender.com/internal/cron/   header: Authorization: Bearer <CRON_SECRET>
#    (CRON_SECRET is generated below; copy it from the service's Environment tab.)
#  * free Postgres expires after ~30 days; the disk is ephemeral, so uploaded files are lost on
#    redeploy unless you set CLOUD_STORAGE_* (S3-compatible). Emails need real SMTP_* values.
databases:
  - name: ums-postgres
    plan: free
    databaseName: ums
    user: umsuser
services:
  - type: web
    name: ums-web
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash deployment/start-single.sh"
    healthCheckPath: /health/
    envVars:
      - {key: PYTHON_VERSION, value: "3.12.3"}
      - {key: DEBUG, value: "0"}
      - {key: DJANGO_SECRET_KEY, generateValue: true}
      - {key: FIELD_ENCRYPTION_KEY, generateValue: true}   # must be a valid Fernet key - run `python manage.py production_check` after first deploy
      - {key: CRON_SECRET, generateValue: true}
      - {key: SCHEDULER_MODE, value: builtin}
      - {key: SECURE_SSL_REDIRECT, value: "1"}
      - {key: SECURE_PROXY_SSL_HEADER, value: "1"}
      - {key: SECURE_COOKIES, value: "1"}
      - {key: DATABASE_URL, fromDatabase: {name: ums-postgres, property: connectionString}}
      # ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS: the app trusts RENDER_EXTERNAL_HOSTNAME automatically.
      - {key: SMTP_HOST, sync: false}
      - {key: SMTP_PORT, value: "587"}
      - {key: SMTP_USE_TLS, value: "1"}
      - {key: SMTP_USER, sync: false}
      - {key: SMTP_PASSWORD, sync: false}
      - {key: DEFAULT_FROM_EMAIL, sync: false}
      - {key: PUBLIC_BASE_URL, sync: false}   # https://<your-app>.onrender.com
      - {key: SAFEPAY_API_KEY, sync: false}
      - {key: SAFEPAY_SECRET_KEY, sync: false}
      - {key: SAFEPAY_WEBHOOK_SECRET, sync: false}
