{% extends "core/base.html" %}
{% block content %}
<section class="panel">
  <h2>{{ title }}</h2>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button class="btn" type="submit">Save</button>
      <a class="btn ghost" href="{{ cancel_url }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
